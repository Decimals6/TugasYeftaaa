<ion-header class="ion-no-border">
  <ion-toolbar class="user-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ tempat.nama || tempat.name || 'Detail Lokasi' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="lihatInfo()" title="Panduan Ibadah">
        <ion-icon slot="icon-only" name="information-circle-outline" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="detail-content">
  <!-- Peta Leaflet Full Screen -->
  <div id="map" class="map-container"></div>

  <!-- Floating Info & Action Panel -->
  <div class="floating-panel">
    <div class="tracker-card">
      <div class="tracker-header">
        <div class="title-meta">
          <span class="badge-activity">Pos Lokasi Manasik</span>
          <h3>{{ tempat.nama || tempat.name }}</h3>
          <p class="subtitle">{{ tempat.keterangan || tempat.description }}</p>
        </div>
      </div>

      <div class="status-indicator">
        <div class="pulse-dot"></div>
        <span>Pelacakan koordinat GPS sedang aktif</span>
      </div>

      <div class="tracker-actions">
        <!-- Tombol Simulasi Dekat Titik Lokasi -->
        <ion-button fill="outline" class="btn-step" (click)="simulasiTiba()">
          <ion-icon name="pin-outline" slot="start"></ion-icon>
          Simulasi Tiba
        </ion-button>

        <!-- Tombol Selesai Rute Manual -->
        <ion-button class="btn-complete" (click)="selesaiRute()">
          <ion-icon name="checkmark-done-outline" slot="start"></ion-icon>
          Selesaikan
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
