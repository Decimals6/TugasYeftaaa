<ion-content [fullscreen]="true">
  <div class="login-container">
    
    <div class="logo-area">
      <div class="logo-circle">
        <ion-icon name="location"></ion-icon>
      </div>
      <h1>E-Mutowif</h1>
      <p>Sistem Monitoring & Panduan Ibadah Haji</p>
    </div>

    <div class="form-card">
      <h2>Selamat Datang</h2>
      <p class="subtitle">Silakan masuk dengan akun yang terdaftar</p>

      <div class="input-group">
        <ion-item lines="none" class="custom-input">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input 
            type="email" 
            placeholder="Username atau Email" 
            [(ngModel)]="usernameEmail">
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-input">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input 
            [type]="showPassword ? 'text' : 'password'" 
            placeholder="Password" 
            [(ngModel)]="password">
          </ion-input>
          <ion-button slot="end" fill="clear" color="medium" (click)="togglePassword()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>
      </div>

      <ion-button expand="block" class="btn-login" (click)="prosesLogin()">
        Masuk Aplikasi
      </ion-button>
      
      <div class="login-footer">
        <p>Butuh bantuan login? Hubungi Admin Kloter</p>
      </div>
    </div>

  </div>
</ion-content>
