<ion-content class="login-content" fullscreen="true">
  <div class="login-wrapper">
    <div class="brand-section">
      <div class="logo-box">
        <ion-icon name="compass-outline"></ion-icon>
      </div>
      <h2>E-Mutowif</h2>
      <p>Panduan & Pemantauan Jamaah Haji</p>
    </div>

    <div class="card-form">
      <h3>Masuk Akun</h3>
      <p class="subtitle">Gunakan kredensial yang telah didaftarkan</p>

      <form (ngSubmit)="onSubmit()">
        <ion-item lines="none" class="input-item">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input
            type="text"
            placeholder="Username atau Email"
            [(ngModel)]="username_email"
            name="username_email"
            required>
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            type="password"
            placeholder="Password"
            [(ngModel)]="password"
            name="password"
            required>
          </ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" class="btn-login">
          Masuk
        </ion-button>
      </form>
    </div>

    <div class="footer-note">
      <p>Sistem Informasi Haji &copy; 2026</p>
    </div>
  </div>
</ion-content>
